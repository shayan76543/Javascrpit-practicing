<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript DOM concept</title>
</head>
<body style="background-color:black; color:white">
    <ul class="languages">
        <li>Javascript</li>
    </ul>
    <script>
        function language_add(languageName){
            const li=document.createElement("li");
            li.textContent=languageName;
            document.querySelector(".languages").appendChild(li);
        }
        language_add("Python");
        language_add("Java");
        function OpLanguage_add(languageName){
            const li=document.createElement("li");
            li.appendChild(document.createTextNode(languageName));
            document.querySelector(".languages").appendChild(li);
        }
        // Edit 
        const secondlang=document.querySelector(".languages li:nth-child(3)");
        const ele=document.createElement("li");
        ele.textContent="openAi";
        secondlang.replaceWith(ele);
        // removing 
        const removelang=document.querySelector("li:last-child");
        removelang.remove();
        const removealang=document.querySelector("li:last-child");
        removealang.remove();
        OpLanguage_add("C++");
        OpLanguage_add("C#");
        OpLanguage_add("Rubby")
    </script>
</body>
</html>
